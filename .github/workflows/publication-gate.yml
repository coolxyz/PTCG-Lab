name: Source, protocol and package gate
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ptcg_p4a
          POSTGRES_DB: ptcg_p4a
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55484:5432']
        options: >-
          --health-cmd "pg_isready -U ptcg_p4a -d ptcg_p4a"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r scripts/migration/requirements.lock
      - run: python -m pip install -r packages/battle-core/requirements.lock
      - run: python -m pip install -r apps/online-server/requirements.lock httpx==0.28.1
      - run: npm ci --ignore-scripts
      - run: npm run p3:build
      - run: npm run p3:product:build
      - run: npm run p5:build
      - run: node scripts/migration/p5c_controller_test.mjs
      - run: npm --prefix apps/web run build -- --outDir ../../var/p3c/legacy-ci
      - run: npx playwright install --with-deps chromium
      - run: npm run p3:test
      - run: python -m pip install --no-build-isolation --no-deps ./packages/battle-protocol ./packages/engine-provider ./packages/battle-core
      - run: python -m pip install --no-build-isolation --no-deps ./apps/online-server
      - run: python -m pip install --no-build-isolation --no-deps ./packages/online-client
      - run: python -m pip install --no-build-isolation --no-deps ./apps/desktop-api
      - run: python -m pytest tests/online_client tests/desktop_bridge tests/desktop_host -q
      - name: Dedicated PostgreSQL session acceptance (synthetic inputs only)
        run: |
          mkdir -p var/p4a
          python -c "from pathlib import Path; p=Path('var/p4a/database-url'); p.write_text('postgresql://ptcg_p4a@127.0.0.1:55484/ptcg_p4a'); p.chmod(0o600)"
          PTCG_V2_TEST_DSN_FILE="$PWD/var/p4a/database-url" python -m pytest tests/online_v2 -q
      - run: python -m pytest tests/core tests/providers tests/protocol tests/migration tests/portable/test_public_export.py -q
      - run: python -m pip download --only-binary=:all: -r packages/battle-protocol/requirements.lock -r packages/battle-core/requirements.lock -r apps/online-server/requirements.lock --dest var/p2/wheelhouse
      - run: python scripts/migration/gate.py --build-output var/p2/ci-build --dependency-wheelhouse var/p2/wheelhouse
      - run: node scripts/migration/p3_package_smoke.mjs var/p2/ci-build
