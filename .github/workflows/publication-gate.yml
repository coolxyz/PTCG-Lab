name: P1 source and package gate
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r scripts/migration/requirements.lock
      - run: npm ci --ignore-scripts
      - run: python -m pytest tests/migration tests/portable/test_public_export.py -q
      - run: python scripts/migration/gate.py --build-output var/p1/ci-build
