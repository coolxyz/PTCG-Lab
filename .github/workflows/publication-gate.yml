name: Source, protocol and package gate
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r scripts/migration/requirements.lock
      - run: python -m pip install -r packages/battle-core/requirements.lock
      - run: npm ci --ignore-scripts
      - run: npm run p3:build
      - run: npx playwright install --with-deps chromium
      - run: npm run p3:test
      - run: python -m pip install --no-build-isolation --no-deps ./packages/battle-protocol ./packages/engine-provider ./packages/battle-core
      - run: python -m pytest tests/core tests/providers tests/protocol tests/migration tests/portable/test_public_export.py -q
      - run: python -m pip download --only-binary=:all: -r packages/battle-protocol/requirements.lock -r packages/battle-core/requirements.lock --dest var/p2/wheelhouse
      - run: python scripts/migration/gate.py --build-output var/p2/ci-build --dependency-wheelhouse var/p2/wheelhouse
      - run: node scripts/migration/p3_package_smoke.mjs var/p2/ci-build
