name: Source, protocol and package gate
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ptcg_p4a
          POSTGRES_DB: ptcg_p4a
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55484:5432']
        options: >-
          --health-cmd "pg_isready -U ptcg_p4a -d ptcg_p4a"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r scripts/checks/requirements.lock
      - run: python -m pip install -r apps/api/requirements.lock -r apps/desktop-api/requirements.lock cryptography==50.0.2
      - run: python -m pip install -r packages/battle-core/requirements.lock
      - run: python -m pip install -r apps/online-server/requirements.lock httpx==0.28.1
      - run: python -m pip install --no-build-isolation --no-deps ./packages/battle-protocol ./packages/engine-provider ./packages/battle-core ./packages/online-client ./apps/desktop-api ./apps/online-server
      - run: npm ci --ignore-scripts
      - run: npm run product:build
      - run: python scripts/checks/release_tree.py
      - run: python -m pytest tests/core tests/providers tests/protocol tests/online_client tests/desktop_bridge tests/desktop_host tests/packaging tests/portable/test_public_export.py -q
      - name: Dedicated PostgreSQL acceptance (synthetic inputs only)
        run: |
          mkdir -p var/ci
          python -c "from pathlib import Path; p=Path('var/ci/database-url'); p.write_text('postgresql://ptcg_p4a@127.0.0.1:55484/ptcg_p4a'); p.chmod(0o600)"
          PTCG_V2_TEST_DSN_FILE="$PWD/var/ci/database-url" python -m pytest tests/online_v2 -q
      - run: python scripts/public/export_source.py --output exports/PTCG-Lab-source.zip
      - run: python scripts/public/audit.py --check --artifact exports/PTCG-Lab-source.zip
