[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-online-server"
version = "0.4.0.dev1"
description = "P4-A native API, PostgreSQL session boundary and pinned rule readiness"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "ptcg-battle-core==0.2.0.dev1",
  "ptcg-engine-provider==0.2.0.dev0",
  "ptcg-battle-protocol==0.2.0.dev1",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "psycopg[binary]==3.2.10",
  "jsonschema==4.25.1",
]
classifiers = ["Development Status :: 1 - Planning"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_online_server", "ptcg_online_server.*"]
namespaces = false

[tool.setuptools.package-data]
ptcg_online_server = ["migrations/*.sql", "schemas/*.json"]
