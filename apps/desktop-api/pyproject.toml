[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-desktop-api"
version = "0.8.0.dev2"
description = "P8-B native runtime, encrypted identity transfer and same-origin bridge"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ptcg-online-client==0.5.0.dev6", "starlette==0.46.2", "uvicorn==0.34.2"]
classifiers = ["Development Status :: 1 - Planning"]

[project.optional-dependencies]
macos-native = ["keyring==25.7.0", "cryptography==50.0.2"]
windows-native = ["pywin32==312; sys_platform == 'win32'", "cryptography==50.0.2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_desktop_api", "ptcg_desktop_api.*"]
namespaces = false
