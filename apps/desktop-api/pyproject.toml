[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-desktop-api"
version = "0.5.0.dev9"
description = "P5-C local online host, bridge and versioned display cache"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ptcg-online-client==0.5.0.dev6", "starlette==0.46.2", "uvicorn==0.34.2"]
classifiers = ["Development Status :: 1 - Planning"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_desktop_api", "ptcg_desktop_api.*"]
namespaces = false
