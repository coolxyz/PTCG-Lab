[package]
name = "ptcg-mobile"
version = "0.8.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "ptcg_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native = ["dep:tauri", "dep:tauri-build"]

[dependencies]
tauri = { version = "=2.12.5", features = [], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
csv = "=1.4.0"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
aes-gcm = "=0.10.3"
zeroize = "=1.9.1"
jsonschema = { version = "=0.33.0", default-features = false }
time = { version = "=0.3.55", features = ["parsing"] }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
rustls-platform-verifier = "=0.7.1"
percent-encoding = "=2.3.2"
getrandom = "=0.3.4"
url = "=2.5.8"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [], optional = true }
swift-rs = { version = "=1.0.9", features = ["build"] }

[profile.release]
codegen-units = 1
strip = true
