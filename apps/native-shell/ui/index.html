<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PTCG Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="launch">
    <header class="brand"><span class="brand-mark" aria-hidden="true">P</span> PTCG LAB <span class="edition">DESKTOP</span></header>
    <section class="welcome" aria-labelledby="welcome-title">
      <div class="intro">
        <p class="eyebrow">你的卡牌对战空间</p>
        <h1 id="welcome-title">每一场对战，<br>都值得认真。</h1>
        <p class="summary">整理心仪的卡组，磨练对战技巧，<br>与朋友开启下一场较量。</p>
        <div class="features" aria-label="应用功能"><span>卡牌与卡组</span><span>人机练习</span><span>网络对战</span></div>
      </div>
      <div class="art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><img src="icon.png" alt="" width="300" height="300"><span class="art-caption">BUILD. PLAY. DISCOVER.</span></div>
    </section>
    <section class="startup" aria-label="启动状态">
      <div class="startup-line"><span class="status-light" aria-hidden="true"></span><div role="status" aria-live="polite"><h2 id="startup-title">正在准备你的牌桌</h2><p id="startup-message">正在启动本机服务，准备就绪后将自动进入。</p></div><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="progress" aria-hidden="true"><span></span></div>
      <p class="startup-help">首次启动可能需要稍长时间。若长时间未进入，可关闭窗口后重新打开。</p>
    </section>
    <footer><span>PTCG Lab Preview</span><span>本机卡组 · 专注对战</span></footer>
  </main>
</body>
</html>
