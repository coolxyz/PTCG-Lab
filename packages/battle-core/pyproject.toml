[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-battle-core"
version = "0.2.0.dev1"
description = "Explicit rule core and frozen-runtime compatibility"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ptcg-engine-provider==0.2.0.dev0", "loguru==0.7.3"]
classifiers = ["Development Status :: 3 - Alpha"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_core", "ptcg_core.*"]
namespaces = false
