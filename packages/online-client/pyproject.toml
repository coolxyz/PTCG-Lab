[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-online-client"
version = "0.5.0.dev5"
description = "P5-A native client with private credentials and durable command recovery"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ptcg-battle-protocol==0.2.0.dev1", "websockets==15.0.1", "jsonschema==4.25.1"]
classifiers = ["Development Status :: 1 - Planning"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_online_client", "ptcg_online_client.*"]
namespaces = false

[tool.setuptools.package-data]
ptcg_online_client = ["schemas/*.json"]
