[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-battle-protocol"
version = "0.2.0.dev1"
description = "P2-A v2 wire contracts and bounded runtime validation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jsonschema==4.25.1", "referencing==0.37.0"]
classifiers = ["Development Status :: 3 - Alpha"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_protocol", "ptcg_protocol.*"]
namespaces = false

[tool.setuptools.package-data]
ptcg_protocol = ["schema/*.json"]
