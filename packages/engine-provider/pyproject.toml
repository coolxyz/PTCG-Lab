[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-engine-provider"
version = "0.2.0.dev0"
description = "P2-B verified rule assets and immutable catalog providers"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptcg_engine_provider", "ptcg_engine_provider.*"]
namespaces = false
